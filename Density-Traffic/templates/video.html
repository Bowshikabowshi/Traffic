<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Traffic Management System</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: flex-start;
            background-color: #333;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .lane {
            margin: 20px;
            text-align: center;
            width: 400px;
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .lane img {
            border: 5px solid #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            height: auto;
        }

        .traffic-light {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 20px;
        }

        .signal-light {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 10px 0;
        }

        .green {
            background-color: green;
        }

        .red {
            background-color: red;
        }

        .yellow {
            background-color: yellow;
        }

        .grey {
            background-color: grey;
        }

        h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }

        .green-timer {
            color: green;
        }

        .red-timer {
            color: red;
        }

        .waiting-time {
            color: #ffcc00;
            font-size: 1.2em;
            margin-top: 5px;
        }

        .button-container {
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function updateData() {
            $.getJSON('/vehicle_data', function (data) {
                // Update vehicle counts
                $('#lane1-vehicles').text(data.lane1_vehicles);
                $('#lane2-vehicles').text(data.lane2_vehicles);
                $('#lane3-vehicles').text(data.lane3_vehicles);
                $('#lane4-vehicles').text(data.lane4_vehicles);

                // Update signal colors and remaining green time for each lane
                updateLaneStatus(1, data);
                updateLaneStatus(2, data);
                updateLaneStatus(3, data);
                updateLaneStatus(4, data);
            });
        }

        function updateLaneStatus(laneNumber, data) {
            // Update signal colors for the lane
            $('#lane' + laneNumber + '-red').attr('class', 'signal-light ' + (data['lane' + laneNumber + '_signal'] === 'red' ? 'red' : 'grey'));
            $('#lane' + laneNumber + '-yellow').attr('class', 'signal-light ' + (data['lane' + laneNumber + '_signal'] === 'yellow' ? 'yellow' : 'grey'));
            $('#lane' + laneNumber + '-green').attr('class', 'signal-light ' + (data['lane' + laneNumber + '_signal'] === 'green' ? 'green' : 'grey'));

            // Update remaining green time for the lane
            $('#lane' + laneNumber + '-remaining-time').text(data['lane' + laneNumber + '_remaining_time']);
            $('#lane' + laneNumber + '-remaining-time').attr('class', data['lane' + laneNumber + '_signal'] === 'green' ? 'timer green-timer' : 'timer red-timer');

            // Update waiting time (newly corrected part)
            const nextGreenTime = data['lane' + laneNumber + '_next_green'];
            if (nextGreenTime > 0) {
                $('#lane' + laneNumber + '-waiting-time').text('Next green in ' + nextGreenTime + 's');
            } else {
                $('#lane' + laneNumber + '-waiting-time').text('Green now!');
            }
        }

        function setFeedType() {
            var type = $('#feed-selector').val();
            $.getJSON('/set_feed_type/' + type, function () {
                refreshFeeds();
            });
        }

        function refreshFeeds() {
            // Refresh video feeds
            $('#lane1 img').attr('src', '/video_feed/lane1?' + new Date().getTime());
            $('#lane2 img').attr('src', '/video_feed/lane2?' + new Date().getTime());
            $('#lane3 img').attr('src', '/video_feed/lane3?' + new Date().getTime());
            $('#lane4 img').attr('src', '/video_feed/lane4?' + new Date().getTime());
        }

        // Periodically fetch new data every second
        setInterval(updateData, 1000);

        // Fetch data when the page loads
        $(document).ready(function () {
            updateData();
            setFeedType();
        });
    </script>
</head>

<body>
    <select id="feed-selector" onchange="setFeedType()">
        <option value="video">Default Video Feed</option>
        <option value="camera">Real Camera Feed</option>
    </select>

    <!-- Lane 1 -->
    <div class="lane" id="lane1">
        <div class="traffic-light">
            <div id="lane1-red" class="signal-light red"></div>
            <div id="lane1-yellow" class="signal-light grey"></div>
            <div id="lane1-green" class="signal-light grey"></div>
            <div class="timer" id="lane1-remaining-time">0</div>
            <div class="waiting-time" id="lane1-waiting-time">0s</div>
        </div>
        <div>
            <h2>Lane 1</h2>
            <img src="/video_feed/lane1" alt="Lane 1 Video">
            <p>Vehicles: <span id="lane1-vehicles">0</span></p>
        </div>
    </div>

    <!-- Lane 2 -->
    <div class="lane" id="lane2">
        <div class="traffic-light">
            <div id="lane2-red" class="signal-light red"></div>
            <div id="lane2-yellow" class="signal-light grey"></div>
            <div id="lane2-green" class="signal-light grey"></div>
            <div class="timer" id="lane2-remaining-time">0</div>
            <div class="waiting-time" id="lane2-waiting-time">0s</div>
        </div>
        <div>
            <h2>Lane 2</h2>
            <img src="/video_feed/lane2" alt="Lane 2 Video">
            <p>Vehicles: <span id="lane2-vehicles">0</span></p>
        </div>
    </div>

    <!-- Lane 3 -->
    <div class="lane" id="lane3">
        <div class="traffic-light">
            <div id="lane3-red" class="signal-light red"></div>
            <div id="lane3-yellow" class="signal-light grey"></div>
            <div id="lane3-green" class="signal-light grey"></div>
            <div class="timer" id="lane3-remaining-time">0</div>
            <div class="waiting-time" id="lane3-waiting-time">0s</div>
        </div>
        <div>
            <h2>Lane 3</h2>
            <img src="/video_feed/lane3" alt="Lane 3 Video">
            <p>Vehicles: <span id="lane3-vehicles">0</span></p>
        </div>
    </div>

    <!-- Lane 4 -->
    <div class="lane" id="lane4">
        <div class="traffic-light">
            <div id="lane4-red" class="signal-light red"></div>
            <div id="lane4-yellow" class="signal-light grey"></div>
            <div id="lane4-green" class="signal-light grey"></div>
            <div class="timer" id="lane4-remaining-time">0</div>
            <div class="waiting-time" id="lane4-waiting-time">0s</div>
        </div>
        <div>
            <h2>Lane 4</h2>
            <img src="/video_feed/lane4" alt="Lane 4 Video">
            <p>Vehicles: <span id="lane4-vehicles">0</span></p>
        </div>
    </div>
</body>

</html>
